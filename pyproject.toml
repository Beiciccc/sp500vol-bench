[project]
name = "sp500vol"
version = "0.0.1"
description = "Evaluating the Incremental Value of Long and Event-Driven Regulatory Disclosures for Volatility Forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Kun Zhang" },
]

dependencies = [
  # === Core scientific ===
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pyarrow>=16.0",                    # parquet
  # === Time-series / econometrics ===
  "arch>=7.0",                        # GARCH / EGARCH
  "statsmodels>=0.14",                # ARIMA, HAR-RV
  "pandas-market-calendars>=4.4",     # US equities trading calendar
  # === NLP ===
  "torch>=2.3",
  "transformers>=4.42,<5",            # 5.x lazy-import (create_import_structure_from_path) hangs on import; pin to 4.x
  "tokenizers>=0.19",
  "datasets>=2.20",
  "accelerate>=0.32",                 # multi-GPU + mixed precision
  # === Data ingestion ===
  "aiohttp>=3.9",                     # async EDGAR fetcher
  "httpx>=0.27",
  "tenacity>=8.4",                    # retry with backoff
  "beautifulsoup4>=4.12",             # 8-K HTML parsing
  "lxml>=5.2",                        # iXBRL parsing
  # === Config / CLI / logging ===
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.2",
  "python-dotenv>=1.0",
  # === Storage / versioning ===
  "filelock>=3.15",
  # === Utilities ===
  "tqdm>=4.66",
  "sentencepiece>=0.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.108",
  "ruff>=0.5,<0.15",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "jupyterlab>=4.2",
]
tracking = [
  "wandb>=0.17",                      # optional experiment tracking
]
viz = [
  "matplotlib>=3.9",
  "seaborn>=0.13",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.108",
  "ruff>=0.5,<0.15",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "jupyterlab>=4.2",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sp500vol"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "PL", "RUF"]
ignore = [
  "PLR0913",   # allow many fn args (common in model configs)
  "PLR2004",   # magic-value comparisons are pervasive + readable (thresholds, dims, test asserts)
  "N803",      # sklearn fit(X, y): uppercase X is idiomatic in ML code
  "RUF002",    # intentional math minus sign (−) in docstring formulae
  "PLC0415",   # deferred imports (statsmodels/arch/torch) keep module import-time light
  "N806",      # X / RV / HAR / DM are the field's notation, same rationale as N803 above
  "N816",      # module-level RV_, DM_ constants follow the same econometric notation
  "RUF001",    # intentional Unicode in docstrings (− minus, × times) matching the papers
  "RUF005",    # [*a, b] is not clearer than a + [b] for short literal concatenation
  "E501",      # long lines are almost all tabular comments and formulae; ruff-format governs code
  "PLR0915",   # audit scripts are intentionally linear top-to-bottom procedures
  "UP031",     # printf-style %-formatting is retained in table/report writers
  "PLW2901",   # rebinding a loop variable is idiomatic in the cleaning passes
  "N802",      # statistical function names (HAR_RV, DM_test) follow the literature
  "E741",      # `l` is the standard index in the lag/horizon formulae
  "RUF059",    # `vals, _ = np.unique(...)`-style partial unpacking is pervasive and readable
  "PLC1802",   # `len(x)` in a truth test is explicit about the container being sized
]



[tool.ruff.lint.per-file-ignores]
# Model factories dispatch one branch per model_id; high branch/return counts
# are inherent and clearer than a dict-of-lambdas indirection.
"scripts/train.py" = ["PLR0911", "PLR0912"]
# One long-document pooling dispatcher: one branch per chunking strategy;
# flattening it into a table would hide the strategy-specific edge cases.
"src/sp500vol/models/neural_text/bert_s1.py" = ["PLR0912"]
# Research/analysis scripts and tests are held to a lighter standard than the package:
# linear procedures, deferred heavy imports, and fixture-driven asserts are intended there.
"scripts/**" = ["E402", "E702", "SIM115", "B007", "PLR0911", "PLR0912", "F841"]
"tests/**"   = ["E402", "E702", "SIM115", "B007", "F841", "PLR0911", "PLR0912", "B023", "E701", "PLW0603"]
# One-off analysis and experiment scripts: frozen records of completed runs.
# They are kept verbatim so the reported numbers stay traceable; style rules that
# would require rewriting them are disabled rather than silently changing history.
"scripts/analysis/**"    = ["SIM117","SIM113","SIM222","SIM108","RUF012","I001","B023","E701","PLW0603","SIM105","RUF007","UP038","E731","RUF046","N814","PLC0206","RUF015","E712","B904","F811","PLR0124","UP031","PLW2901"]
"scripts/experiments/**" = ["SIM117","SIM113","SIM222","SIM108","RUF012","I001","B023","E701","PLW0603","SIM105","RUF007","UP038","E731","RUF046","N814","PLC0206","RUF015","E712","B904","F811","PLR0124","UP031","PLW2901"]

[tool.mypy]
python_version = "3.11"
strict = false                        # ramp up gradually
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
markers = [
  "slow: marks tests that take >5s",
  "gpu: marks tests requiring GPU",
  "network: marks tests requiring internet",
]
