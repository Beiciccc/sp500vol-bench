# D2 Gated fusion — HAR-RV price features ⊕ FinBERT text embedding.
# Tests H5: does joint price+text beat either modality alone?

defaults:
  - /base
  - _self_

model_id: D2_gated_fusion
model_class: sp500vol.models.fusion.gated_fusion.GatedFusion

encoder:
  pretrained: ProsusAI/finbert
  max_length: 512

fusion:
  proj_dim: 128

head:
  hidden_dim: 128
  dropout: 0.1

training:
  optimizer: adamw
  lr: 8.0e-5                     # linear-scaled to effective batch 128 (1e-5 x 8)
  weight_decay: 0.01
  batch_size: 128                # effective batch = 128 (physical; fusion has no grad-accum) — confirm at probe
  mixed_precision: bf16
  warmup_ratio: 0.06             # linear warmup then decay — required at lr 8e-5
  max_epochs: 15
  early_stopping: true           # val-based; restore best-val epoch (COVID-2020/21 val)
  es_patience: 3
  es_min_delta: 0.0
  log_target: true
  # DataLoader workers — text is now pre-tokenised once (cross-horizon/epoch _TokenCache)
  # with a picklable collate, so multi-worker loading is safe. This closes the only
  # CPU-stall path in the suite (was num_workers=0 + per-batch encoder.tokenize). S1-like
  # 512-tok / batch 128.
  pretokenize: true
  tokenizer_threads: 24
  dataloader_num_workers: 8
  dataloader_persistent_workers: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4

compute:
  required_gpu: A100_40G         # unified rerun hardware (4xA100 40G)
  estimated_hours_per_seed: 0.3  # refine at the A100 smoke
