# A3 GARCH(1,1) — per-firm fit on log returns up to filing time.
# Standard econometric benchmark; one of the H1 anchors.

defaults:
  - /base
  - _self_

model_id: A3_garch
model_class: sp500vol.models.price.garch.GARCH

garch:
  p: 1
  q: 1
  vol_model: GARCH
  dist: normal
  min_history: 100

evaluation:
  per_disclosure_subset: true
  per_horizon: true
