# B3 Loughran-McDonald dictionary proportions + Ridge.
# Requires data/external/loughran_mcdonald.csv (download separately from
# https://sraf.nd.edu/loughranmcdonald-master-dictionary/).
# Falls back to a mock dictionary when the file is missing — only useful for
# unit tests and CI smoke runs, NOT for paper results.

defaults:
  - /base
  - _self_

model_id: B3_lm_linear
model_class: sp500vol.models.classical_text.lm_linear.LMLinear

dictionary:
  csv_path: ./data/external/loughran_mcdonald.csv
  use_mock_if_missing: false   # real L-M Master Dictionary (1993-2025) now present

training:
  ridge_alpha: null         # RidgeCV picks alpha per horizon
  log_target: true
  fit_per_horizon: true

evaluation:
  per_disclosure_subset: true
  per_horizon: true
