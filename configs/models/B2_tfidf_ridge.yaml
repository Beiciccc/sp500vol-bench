# B2 TF-IDF (1-2 grams) + Ridge. Stronger BoW variant. CPU-only.

defaults:
  - /base
  - _self_

model_id: B2_tfidf_ridge
model_class: sp500vol.models.classical_text.tfidf_ridge.TfidfRidge

vectoriser:
  max_features: 5000
  ngram_range: [1, 2]
  sublinear_tf: true
  token_pattern: '(?u)\b[a-z]{2,}\b'

training:
  ridge_alpha: null         # RidgeCV picks alpha per horizon
  log_target: true
  fit_per_horizon: true

evaluation:
  per_disclosure_subset: true
  per_horizon: true
