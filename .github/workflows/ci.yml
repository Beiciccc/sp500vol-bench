name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch so PRs don't queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra viz

      - name: Run pytest (fast tests only — no network/GPU/slow)
        run: uv run pytest tests/ -v -m "not slow and not gpu and not network"

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (dev only — skip torch for speed)
        run: |
          uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Mypy
        run: uv run mypy src/sp500vol/ || true
        # `|| true` for now — strict mypy will be ramped up later.
        # Remove once full type coverage is in place.

  licence-guard:
    name: licensed-data guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # release/ is the licence-safe public bundle: it must never carry a
      # per-row CRSP-derived value. This fails the build if one reappears.
      - name: No CRSP-derived per-row values in release/
        run: |
          set -e
          if grep -rInE '"(labels|feature_rv[a-z0-9_]*|realised_vol[a-z0-9_]*|logRV[a-z0-9_]*|ret_[a-z0-9_]*)"[[:space:]]*:' release/ ; then
            echo "::error::A CRSP-derived per-row field appeared in release/. See release/DATA_CARD.md."
            exit 1
          fi
          echo "release/ carries no per-row CRSP-derived field."
      - name: No CRSP artefacts tracked under data/
        run: |
          set -e
          if git ls-files data/ | grep -InE 'crsp|permno|daily_returns|aligned_filings' ; then
            echo "::error::A CRSP-derived artefact is tracked under data/."
            exit 1
          fi
          echo "No CRSP artefact tracked under data/."
