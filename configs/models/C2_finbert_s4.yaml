# C2 FinBERT + S4 hierarchical chunk encoder.
# S2 chunk CLS embeddings pass through chunk-level self-attention before pooling.

defaults:
  - /base
  - _self_

model_id: C2_finbert_s4
model_class: sp500vol.models.neural_text.bert_s4.FinBertS4
strategy: S4

encoder:
  pretrained: ProsusAI/finbert
  max_length: 512

chunking:
  chunk_stride: 256
  max_chunks: 8

hierarchy:
  chunk_num_heads: 8
  chunk_encoder_layers: 1
  chunk_ff_dim: null

head:
  hidden_dim: 128
  dropout: 0.1

training:
  optimizer: adamw
  lr: 8.0e-5                     # linear-scaled to effective batch 128 (1e-5 x 8)
  weight_decay: 0.01
  batch_size: 8                  # chunk 16x512; A100-40G bf16 — confirm at probe (target 36G)
  grad_accumulation_steps: 16    # effective batch = 128 (unified across C1-C4/D1-D2)
  mixed_precision: bf16
  warmup_ratio: 0.06             # linear warmup then decay — required at lr 8e-5
  max_epochs: 15
  early_stopping: true           # val-based; restore best-val epoch (COVID-2020/21 val)
  es_patience: 3
  es_min_delta: 0.0
  tokenization_batch_size: 512
  tokenizer_threads: 24
  pretokenize: true
  log_target: true
  # DataLoader workers — chunk collate is now a picklable functools.partial and the dataset
  # is pre-tokenised, so multi-worker loading is safe. Lower than S1 (4 workers, prefetch 2)
  # because each chunk batch is 16x512 — keeps host RAM in budget across 4 GPUs.
  dataloader_num_workers: 4
  dataloader_persistent_workers: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2

compute:
  required_gpu: A100_40G         # unified rerun hardware (4xA100 40G)
  estimated_hours_per_seed: 0.7  # refine at the A100 smoke
