# C5 (Qwen3-Embedding-8B) — frozen decoder-LLM embedding probe.
# PRIMARY modern-LLM lineage: 2025 MTEB-SOTA instruction-tuned embedding model on
# the Qwen3 decoder. Encoder FROZEN; only the per-horizon head trains on cached
# embeddings. Tests whether a state-of-the-art modern representation changes the
# negative result. One of three embedding lineages (Qwen3-Embedding-8B /
# gte-Qwen2-7B / e5-mistral-7B) for robustness to a single model choice.

defaults:
  - /base
  - _self_

model_id: C5_qwen3
model_class: sp500vol.models.neural_text.qwen_llm.C5LLMProbe
strategy: C5_qwen3

encoder:
  pretrained: Qwen/Qwen3-Embedding-8B
  max_length: 4096          # frozen 8B; A100-40G-safe. Tune up to 8192 at smoke.

llm:
  instruction: "Represent this corporate financial disclosure for forecasting the issuing firm's future stock-return volatility"
  normalize_emb: true       # L2-normalise pooled embeddings (model-card convention)
  encode_batch_size: 8      # 8B forward batch; tune at the A100 smoke
  cache_embeddings: true    # encode each filing once; reuse across seeds/horizons/splits + C5/D3

head:
  hidden_dim: 128
  dropout: 0.1

training:
  optimizer: adamw
  lr: 1.0e-4                # head-only probe regime (not the fine-tune linear scaling)
  weight_decay: 0.01
  batch_size: 512           # tiny head on cached embeddings — large batch is free
  mixed_precision: bf16     # frozen 8B encode in bf16 + head autocast
  warmup_ratio: 0.06
  max_epochs: 40            # head-only probe (cached embeddings) is cheap; generous cap + early stop guards against underfit (vs fine-tune 15)
  early_stopping: true
  es_patience: 3
  es_min_delta: 0.0
  log_target: true
  tokenizer_threads: 24            # pin RAYON for the up-front 7B-encode tokenise

compute:
  required_gpu: A100_40G
  estimated_hours_per_seed: 0.5   # encode cached once (shared across C5/D3); head trivial
