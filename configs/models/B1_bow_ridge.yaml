# B1 BoW + Ridge — Kogan et al. 2009 replication.
# Classical bag-of-words baseline. CPU-only.

defaults:
  - /base
  - _self_

model_id: B1_bow_ridge
model_class: sp500vol.models.classical_text.bow_ridge.BoWRidge

vectoriser:
  max_features: 5000
  token_pattern: '(?u)\b[a-z]{2,}\b'

training:
  ridge_alpha: null         # RidgeCV picks alpha per horizon from a grid 0.1..10000
  log_target: true
  fit_per_horizon: true

evaluation:
  per_disclosure_subset: true
  per_horizon: true
