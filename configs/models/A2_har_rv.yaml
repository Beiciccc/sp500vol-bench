# A2 HAR-RV — primary price-only baseline (H1 anchor).
# See src/sp500vol/models/price/har_rv.py.

defaults:
  - /base
  - _self_

model_id: A2_har_rv
model_class: sp500vol.models.price.har_rv.HARRV

features:
  # HAR-RV uses three RV components: daily, weekly (5d), monthly (22d).
  rv_lags: [1, 5, 22]
  log_transform: true

training:
  estimator: ols                    # plain OLS in log space
  log_target: true                  # fit log(RV); predict in log space then retransform
  smearing: true                    # Duan (1983) smearing — exp(Xb)*mean(exp(resid)) targets
                                    # E[RV] not the median, removing the log-HAR under-forecast
  fit_per_firm: false               # pooled panel HAR (one OLS per horizon across all firms) —
                                    # what the code actually does; per-firm overfits short panels

evaluation:
  per_disclosure_subset: true
  per_horizon: true
