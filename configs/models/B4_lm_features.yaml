# B4 L-M proportions + engineered length/readability features.
# Same dictionary requirement as B3.

defaults:
  - /base
  - _self_

model_id: B4_lm_features
model_class: sp500vol.models.classical_text.lm_features.LMFeatures

dictionary:
  csv_path: ./data/external/loughran_mcdonald.csv
  use_mock_if_missing: false   # real L-M Master Dictionary (1993-2025) now present

engineered_features:
  - log_token_count
  - mean_word_length
  - mean_sentence_length
  - punctuation_density

training:
  ridge_alpha: null         # RidgeCV picks alpha per horizon
  log_target: true
  fit_per_horizon: true

evaluation:
  per_disclosure_subset: true
  per_horizon: true
