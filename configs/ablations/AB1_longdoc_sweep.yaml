# AB1 long-doc strategy sweep — the headline ablation for long-doc handling.
# Tests H3: long-doc strategy materially affects predictive performance.

defaults:
  - /base
  - _self_

ablation_id: AB1
hypothesis: H3
description: "Sweep S1-S5 long-doc strategies on FinBERT/Longformer × long-form disclosures."

# Models to compare (each is a separately trained model config)
models:
  - C2_finbert_s1                   # truncation (lower bound)
  - C2_finbert_s2                   # chunk-mean
  - C2_finbert_s3                   # chunk-attention
  - C2_finbert_s4                   # hierarchical chunk self-attention
  - C4_longformer                   # S5 Longformer-style; shared with C4 standalone model

disclosure_subset: long_form        # 10-K + 10-Q only (where long-doc effect is largest)

horizons: [5, 10, 20]
seeds: [2026, 2027, 2028]

statistics:
  dm_test_vs: A2_har_rv             # implemented strategies compared against HAR-RV via DM test
  bootstrap_n_iter: 1000
  bootstrap_block_size: 20

reporting:
  in_paper: true
  paper_table: 1
  in_dissertation: true
  dissertation_appendix: C
