# A5 ARIMA on log of trailing 22-day realised volatility.
# Per-firm ARIMA(p, d, q) with default (1, 0, 1) order.

defaults:
  - /base
  - _self_

model_id: A5_arima
model_class: sp500vol.models.price.arima.ARIMAVol

arima:
  order: [1, 0, 1]
  min_history: 60

evaluation:
  per_disclosure_subset: true
  per_horizon: true
